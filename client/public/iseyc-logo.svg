<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d6b44"/>
      <stop offset="100%" stop-color="#0B5D3B"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="200" cy="150" r="140" fill="url(#g)"/>
  <circle cx="200" cy="150" r="122" fill="#fff" stroke="#C9A227" stroke-width="6"/>
  <!-- Ring text path -->
  <path id="ring" d="M200,150 m-105,0 a105,105 0 1,1 210,0 a105,105 0 1,1 -210,0" fill="none"/>
  <text fill="#0B5D3B" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">
    <textPath href="#ring" startOffset="0%">INITIATIVE FOR SUSTAINABLE EVOLUTION FOR THE YOUTH AND COMMUNITY</textPath>
  </text>
  <!-- Hands -->
  <g transform="translate(118,78)">
    <path d="M8,28 L8,12 Q8,4 16,4 L20,4" fill="none" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round"/>
    <path d="M22,30 L22,10 Q22,4 28,4" fill="none" stroke="#F5C6A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M34,28 L34,12 Q34,4 40,4" fill="none" stroke="#D4A574" stroke-width="5" stroke-linecap="round"/>
    <path d="M10,20 L40,20" fill="none" stroke="#2C1810" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Lightbulb -->
  <g transform="translate(248,72)">
    <circle cx="20" cy="18" r="14" fill="none" stroke="#1e3a5f" stroke-width="3"/>
    <path d="M12,30 h16" stroke="#1e3a5f" stroke-width="2"/>
    <path d="M14,34 h12" stroke="#1e3a5f" stroke-width="2"/>
    <g stroke="#C9A227" stroke-width="2" stroke-linecap="round">
      <path d="M20,0 v-6"/><path d="M34,8 l5,-5"/><path d="M6,8 l-5,-5"/><path d="M38,20 h6"/><path d="M2,20 h-6"/>
    </g>
  </g>
  <!-- Tree -->
  <g transform="translate(200,155)">
    <ellipse cx="0" cy="-8" rx="36" ry="28" fill="#1a7a45"/>
    <ellipse cx="-18" cy="0" rx="20" ry="16" fill="#228B4A"/>
    <ellipse cx="18" cy="0" rx="20" ry="16" fill="#228B4A"/>
    <path d="M0,20 L0,-5 M0,10 L-12,-5 M0,10 L12,-5" stroke="#8B5A2B" stroke-width="4" fill="none"/>
    <path d="M-20,28 Q0,18 20,28" fill="none" stroke="#4C6EF5" stroke-width="3" stroke-linecap="round"/>
    <path d="M-16,32 Q0,24 16,32" fill="none" stroke="#4C6EF5" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- ISEYC wordmark -->
  <text x="200" y="210" text-anchor="middle" font-family="Georgia,serif" font-size="28" font-weight="700" fill="#0B5D3B">ISEYC</text>
  <!-- Banner -->
  <path d="M40,250 Q200,235 360,250 L350,290 Q200,275 50,290 Z" fill="#0B5D3B"/>
  <text x="200" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff" letter-spacing="1">EMPOWERING YOUTH, SHAPING FUTURE</text>
</svg>
